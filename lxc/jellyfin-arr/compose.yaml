# Deployed to /opt/arr/compose.yaml in pve CT 200 (jellyfin, 10.0.0.10). Not Argo-managed:
#   scp lxc/jellyfin-arr/compose.yaml root@10.0.0.10:/opt/arr/ && ssh root@10.0.0.10 'cd /opt/arr && docker compose up -d'
# Spec: docs/superpowers/specs/2026-11-28-arr-stack-design.md
x-common: &common
  restart: unless-stopped
  environment: &env
    PUID: "107"   # jellyfin
    PGID: "110"   # jellyfin
    TZ: Asia/Seoul

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      TZ: Asia/Seoul
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      # Push the forwarded port into qBittorrent (WebUI has "bypass auth for localhost" on).
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -qO- --retry-connrefused --post-data
        "json={\"listen_port\":{{PORTS}},\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      FIREWALL_OUTBOUND_SUBNETS: 10.0.0.0/24
    volumes:
      - /opt/arr/gluetun/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    ports:
      - "8080:8080"   # qBittorrent WebUI

  qbittorrent:
    <<: *common
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:5.3.1_v2.1.3-ls490
    network_mode: service:gluetun   # no route except the tunnel = kill switch
    depends_on:
      gluetun: { condition: service_healthy }
    environment:
      <<: *env
      WEBUI_PORT: "8080"
    volumes:
      - /opt/arr/config/qbittorrent:/config
      - /media:/data

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:3.1.0.5799-ls170
    container_name: prowlarr
    volumes: [/opt/arr/config/prowlarr:/config]
    ports: ["9696:9696"]

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls7
    container_name: sonarr
    volumes: [/opt/arr/config/sonarr:/config, /media:/data]
    ports: ["8989:8989"]

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    volumes: [/opt/arr/config/radarr:/config, /media:/data]
    ports: ["7878:7878"]

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls374
    container_name: bazarr
    volumes: [/opt/arr/config/bazarr:/config, /media:/data]
    ports: ["6767:6767"]

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    container_name: seerr
    restart: unless-stopped
    init: true
    environment: { TZ: Asia/Seoul }
    volumes: [/opt/arr/config/seerr:/app/config]
    ports: ["5055:5055"]
