# claude-box agent (LXC 203 `claude` on pve-k12, 10.0.0.13) — cluster-admin, by owner decision
# (2026-11-14): scoped operator RBAC left it unable to fix things remotely.
# Also has root SSH (key dev@claude-box) on pve, pve-k12, jellyfin, immich — that box IS a root credential.
# ArgoCD selfHeal still reverts manual drift on managed resources; durable changes go through git.
#
# Token: the SA token Secret below (filled by the token controller). The box's ~/.kube/config
# embeds it; rotate = delete the Secret, let ArgoCD recreate, re-run claude-box/kube-readonly.sh.
apiVersion: v1
kind: Namespace
metadata: {name: claude-box}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: claude, namespace: claude-box}
---
apiVersion: v1
kind: Secret
metadata:
  name: claude-token
  namespace: claude-box
  annotations: {kubernetes.io/service-account.name: claude}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: claude-box-admin}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin}
subjects: [{kind: ServiceAccount, name: claude, namespace: claude-box}]
