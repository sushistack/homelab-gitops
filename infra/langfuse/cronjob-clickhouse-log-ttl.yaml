# Keeps clickhouse's own system.trace_log / system.metric_log tables from growing
# unbounded. These are ClickHouse's internal diagnostic logs (query profiler + 1s
# metric snapshots), not Langfuse trace data (see _bmad-output/implementation-artifacts/
# investigations/langfuse-fan-noise-investigation.md for the full incident history).
#
# v1 of this job set a 3-day TTL via ALTER TABLE ... MODIFY TTL. That recurred: TTL
# enforcement itself runs as a background merge, and metric_log (1 row/sec) had piled
# up 13,000+ tiny parts by the time the first 3-day-old partition needed merging away —
# too much to merge in one shot, so it OOM'd and retry-looped forever, pegging a CPU
# core again (2026-07-07, three days after the TTL was first applied).
#
# Fix: TRUNCATE hourly instead of relying on TTL-triggered merges. Truncate just drops
# parts, no merge required, so it can never accumulate a backlog large enough to OOM.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-clickhouse-log-ttl
  namespace: langfuse
spec:
  schedule: "0 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: truncate-system-logs
              image: docker.io/bitnamilegacy/clickhouse:25.2.1-debian-12-r0
              env:
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-secrets
                      key: clickhouse-password
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  clickhouse-client --host langfuse-clickhouse --password "$CLICKHOUSE_PASSWORD" -q \
                    "TRUNCATE TABLE IF EXISTS system.trace_log;"
                  clickhouse-client --host langfuse-clickhouse --password "$CLICKHOUSE_PASSWORD" -q \
                    "TRUNCATE TABLE IF EXISTS system.metric_log;"
