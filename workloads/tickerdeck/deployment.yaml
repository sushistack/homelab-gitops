# TickerDeck — always-on market dashboard (github.com/sushistack/ticker.deck), driven by a
# Raspberry Pi Chromium kiosk on an 8.8" 1920x480 panel. Own image, built by the app repo's
# container.yml workflow -> GHCR.
#
# Stateless / Disposable: quotes+charts are an in-memory cache (4s / 1-10min) rehydrated from
# Binance + Yahoo on first request. No volumes, no PVC, no backup CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickerdeck
spec:
  # excalidraw golden path: replicas 2 so a pod delete self-heals with zero downtime and the
  # health gate has live pods serving while a bad version is held. Two independent in-memory
  # caches is harmless here (read-only market data, 4s TTL) — no session affinity needed.
  replicas: 2
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  # Hand-written selector (NOT from kustomize labels) so it stays immutable across re-applies.
  selector:
    matchLabels:
      app.kubernetes.io/name: tickerdeck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tickerdeck
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tickerdeck
          # Immutable sha tag from the app repo's GHCR workflow (NOT :latest — version-lint
          # rejects floating refs). Upgrade = bump here via PR; mirrored in versions.yaml.
          image: ghcr.io/sushistack/ticker.deck:sha-d3c4ce3
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: TZ
              value: Asia/Seoul
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Memory limit only — NO cpu limit (a cpu limit causes CFS throttling).
              memory: 256Mi
          # /readyz is the app's own readiness endpoint; the Pi kiosk unit polls /healthz too.
          # startupProbe gates liveness until the Node server is up (golden-path guard).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
