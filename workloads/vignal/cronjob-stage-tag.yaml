# vignal-stage-tag (2026-11-10): suspended, never scheduled. Manual one-off `vignal run --stage tag` via
# `argocd app actions run vignal create-job --kind CronJob --resource-name vignal-stage-tag`: collects the
# Gemini batch results (subjects + vtopic) between scheduled runs. LLM only, no YouTube quota. Same run lock
# as `vignal` (ErrBusy while a run is in progress). Keep the image in step with cronjob.yaml.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vignal-stage-tag
spec:
  schedule: "0 */6 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  suspend: true
  # A hung run + Forbid would silently skip later runs; bound it so it fails visibly.
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0            # a failed run is a failed run (vignal AD-7); next schedule resumes
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vignal
            app.kubernetes.io/component: collector
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-sushistack
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: vignal
              # Immutable sha tag from the app repo's CI (NOT :latest — version-lint rejects
              # floating refs). Upgrade = bump here + versions.yaml in one PR.
              image: ghcr.io/sushistack/vignal@sha256:ae3191f2caf8dab6d030235a3a74272759d0225591fd039b6c7f563ba6e05036   # sha-cda2128 (vignal main: tag hold_hours + compact vtopic + topic-overrides.yaml, 2026-11-13 user-approved + audited vtopic rules + empty-label resend)
              args: ["run", "--stage", "tag"]
              env:
                - name: TZ
                  value: Asia/Seoul
                - name: VIGNAL_PUBLISH_TARGET
                  value: r2
                - name: VIGNAL_DB
                  value: /data/vignal.db
                - name: VIGNAL_CONFIG_DIR
                  value: /config
                - name: VIGNAL_SCHEMA_SUPPORT_URL
                  value: https://${SECRET:DOMAIN_VIGNAL_SITE}/schema-support.json
                - name: TMPDIR
                  value: /tmp
              envFrom:
                - secretRef:
                    name: vignal-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 2Gi # 2026-11-10: seed 로 추적 1,913→3,500 대비 미리 올림(dev 발행이 1Gi 에서 OOM). 2026-11-03: 512Mi 에서 publish OOMKilled (job 29893860)
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vignal-data
            - name: config
              configMap:
                name: vignal-config
            - name: tmp
              emptyDir: {}
