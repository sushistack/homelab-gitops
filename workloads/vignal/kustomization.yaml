apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - cronjob.yaml
  - cronjob-stage-tag.yaml    # suspended; manual `vignal run --stage tag` (Gemini batch results between runs)
  - cronjob-dev-publish.yaml   # dev data (2026-11-06): daily `vignal publish-dev` -> public bucket dev/
  - sealedsecret.yaml        # vignal-secrets: collector API/R2/CF/ntfy/ping/age-recipient (sealed to name+ns)
  - sealedsecret-ghcr.yaml   # ghcr-sushistack: pull cred for the PRIVATE collector image (re-sealed for ns vignal)
  - seeds/cronjob-seed-2026-11-11-w3a.yaml
  - seeds/cronjob-seed-2026-11-11-w34.yaml   # 2026-11-11 one-off: w3+w4 tonight 23:00 KST (user-approved); remove after it ran   # 2026-11-11 one-off seed tonight 22:40 KST (user-approved); remove after it ran
# NOT included on purpose: seal.sh / secrets.env.example (operator tooling; secrets.env is git-ignored).
# No Service / Ingress: the collector has no public inbound (vignal AD-1).

# config/ -> vignal-config ConfigMap mounted at /config. Copy of the vignal repo's config/ with the
# domain + Cloudflare ids tokenized (${SECRET:*}, ADR-0006). Stable name for the CronJob volume.
configMapGenerator:
  - name: vignal-config
    files:
      - config/collector.yaml
      - config/policy.json
      - config/topics.yaml
      - config/approvals.yaml   # Story 9.6 (FR-30a): git approvals file, source of truth lives only here
      - config/rpm.yaml   # Story 14.6 (FR-49): RPM ranges, copy of vignal config/rpm.yaml
      - config/revenue-exclusions.yaml   # Story 14.6: channels excluded from revenue estimates
      - config/open-score.yaml   # Story 21.3 (FR-63): open_score components/weights, copy of vignal config/open-score.yaml
      - config/observe-tags.yaml   # Story 28.3 (FR-86): observe tag enums, copy of vignal config/observe-tags.yaml
      - config/subject-types.yaml   # Story 33.1/33.2 (FR-101, AD-49): subject type list; absent = subject extraction off, topic tagging continues
  # 2026-11-11 (user-approved): seed waves w3/w4 swapped -- 111 over-cap vlog/web-drama/education channels out, tech/
  # mukbang/movie-review/cooking/beauty 1만~5만 in (same count). The CronJobs (applied outside GitOps, see vignal
  # docs/ops/seeds/seed-2026-11-09.cronjob.yaml) mount these by name. Remove both entries after 2026-11-13.
  - name: vignal-seed-2026-11-09-w3
    files:
      - seed.yaml=seeds/seed-2026-11-09-w3.yaml
  - name: vignal-seed-2026-11-09-w4
    files:
      - seed.yaml=seeds/seed-2026-11-09-w4.yaml
  - name: vignal-seed-2026-11-11-w3a
    files:
      - seed.yaml=seeds/seed-2026-11-11-w3a.yaml
  - name: vignal-seed-2026-11-11-w34
    files:
      - seed.yaml=seeds/seed-2026-11-11-w34.yaml
generatorOptions:
  disableNameSuffixHash: true

# `labels:` only — never commonLabels (selector pollution) or namePrefix (breaks SealedSecret
# name+ns binding).
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: vignal
      app.kubernetes.io/part-of: vignal
      app.kubernetes.io/managed-by: argocd
