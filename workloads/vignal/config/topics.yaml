# 2026-10-25 주제 순위 계획 1: 2·3단계 노드(spec §3.1). 부모는 위에 먼저 둔다.
# 3단계는 실제 추적 영상이 있는 것만 둔다. status: candidate 는 LLM 후보에서 빠지고
# 운영자 검수로만 붙는다. 운영자가 tags pending 의 새 후보를 보고 늘린다.
# redirect_from: [game/hns] — 노드 경로를 바꿀 때 옛 경로(노드 경로 형식, 다른 노드의 현재 경로와 겹치면 안 됨).
