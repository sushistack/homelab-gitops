# config/topics.yaml — C-5 주제 사전 (contracts.md)
#
# 형태: 슬러그·한국어 라벨·표시 순서를 가진 사전. 내용과 분류 방식은 Q-14 미정(차단 아님).
# collector CLI `vignal approve --topic <slug>` 는 이 사전의 값만 받는다. 생략하면 채널의
# topic 은 null(주제 미확인)로 기록된다(AD-9). web 은 이 목록 순서를 그대로 주제 필터 옵션으로
# 쓰며 하드코딩하지 않는다(AD-10, meta.topics).
#
# 아래 topics 배열은 표시 순서다. Q-14 의 분류 방식은 여전히 미정(차단 아님)이고, 이 목록은
# 2026-09-30 페르소나 평가 지적(주제 라벨 0개)에 대한 임시 사전이다. 추적 채널 25개의 최근
# 영상 제목을 보고 채널 단위로 정했다.

topics:
  - slug: game
    label: '게임'
  - slug: movie-review
    label: '영화·애니 리뷰'
  - slug: mukbang
    label: '먹방'
  - slug: mystery
    label: '공포·미스터리'
  - slug: beauty-life
    label: '뷰티·라이프'
  - slug: tech
    label: '테크'
  - slug: news
    label: '뉴스·시사'
  - slug: economy
    label: '경제·재테크'
  # 2026-10-04: 롱폼 웹드라마가 드물어(대부분 Shorts 로 이동) 범위를 롱폼 코미디·예능으로 넓혔다.
  # 슬러그는 이미 부여된 채널·공유 링크 때문에 유지하고 라벨만 바꾼다(운영자 결정, Story 9.5).
  - slug: web-drama
    label: '코미디·예능'
  # 2026-10-18: 음악(플레이리스트·자작곡) 채널용으로 추가(운영자 결정). 첫 채널은 라이크둠칫.
  - slug: music
    label: '음악'

# 2026-10-25 주제 순위 계획 1: 2·3단계 노드(spec §3.1). 부모는 위에 먼저 둔다.
# 3단계는 실제 추적 영상이 있는 것만 둔다. status: candidate 는 LLM 후보에서 빠지고
# 운영자 검수로만 붙는다. 운영자가 tags pending 의 새 후보를 보고 늘린다.
