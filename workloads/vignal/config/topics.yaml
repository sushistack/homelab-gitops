# config/topics.yaml — C-5 주제 사전 (contracts.md)
#
# 형태: 슬러그·한국어 라벨·표시 순서를 가진 사전. 내용과 분류 방식은 Q-14 미정(차단 아님).
# collector CLI `vignal approve --topic <slug>` 는 이 사전의 값만 받는다. 생략하면 채널의
# topic 은 null(주제 미확인)로 기록된다(AD-9). web 은 이 목록 순서를 그대로 주제 필터 옵션으로
# 쓰며 하드코딩하지 않는다(AD-10, meta.topics).
#
# 아래 topics 배열은 표시 순서다. 처음 목록은 2026-09-30 페르소나 평가 지적(주제 라벨 0개)에
# 대한 임시 사전이었고, 추적 채널 25개의 최근 영상 제목을 보고 채널 단위로 정했다.
#
# 2026-10-26: 분류가 잘 안 맞아(형식과 주제가 한 줄에 섞여 있었다) 주제를 늘리고 위에 그룹 한 단계를
# 두었다(운영자 결정). 뼈대는 YouTube Data API topicId 부모 7개, 이름은 국내 장르 관례를 따랐다.
# 근거: docs/analysis/topic-taxonomy-2026-10-26.md
# - group 은 표시용 묶음이다. 노드 경로(game/arpg/poe2)와 저장된 topic 값에는 들어가지 않는다.
# - 기존 슬러그는 채널·공유 링크 때문에 유지하고 라벨만 바꾼다(web-drama 와 같은 방식).
#   beauty-life → '뷰티', movie-review → '영화·드라마'. 일상 채널은 vlog, 애니는 anime 로 운영자가 다시 배정한다.
# - 형식(리뷰·브이로그·ASMR·리액션 등) 축은 따로 두지 않았다. 분류가 계속 어긋나면 그때 둔다.
# - 새 주제에 config/rpm-model.yaml 배수가 없으면 RPM 은 전체 주제 행을 쓴다(AD-22).

groups:
  - slug: game
    label: '게임'
  - slug: entertainment
    label: '엔터테인먼트'
  - slug: music
    label: '음악'
