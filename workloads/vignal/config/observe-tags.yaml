# 관찰 태그 정의 (Story 28.3, FR-86, AD-40). 모델은 여기 적힌 enum·정수 값만 돌려줄 수 있다.
# 출처: docs/analysis/ranking-ai-eval-vignal-score-review-2026-10-26.md §3.2 enum 초안.
# 2026-10-26 품질 확인(100장×3회) 뒤 운영자 결정으로 필드를 줄였다: face·expression·subject·text_emphasis·contrast 삭제,
# text_words 는 두 범주, title.has_number·brackets 는 제목 문자열에서 코드로 계산(source: code, 모델에 묻지 않음).
# hint 는 프롬프트에 들어가는 한 줄 정의다(값의 뜻). labels·ranges 는 28.4 비교 화면에 쓰는 표시 전용 한국어 이름이며
# 프롬프트에 들어가지 않는다.
# 이 파일에서 시스템 프롬프트를 만들므로 값·hint 를 바꾸면 프롬프트 접두부(컨텍스트 캐시)와
# 품질 확인 100장×3회(docs/ops/observe-tags.md)를 다시 거쳐야 한다.
min_confidence: 0.6 # [ASSUMPTION] 필드별 신뢰도가 이 값 미만이면 그 필드는 비운다

thumb:
  - name: face_count
    min: 0
    max: 5
    hint: "썸네일에 보이는 사람 얼굴 수. 그림·캐릭터 얼굴도 센다. 5명 이상이면 5"
    ranges: [{max: 0, label: 얼굴 0명}, {max: 1, label: 얼굴 1명}, {max: 5, label: 얼굴 2명 이상}]
  - name: text_words
    values: [few, many]
    hint: "썸네일 위에 적힌 글자의 단어(띄어쓰기 단위) 수. few=글자 없음 또는 3단어 이하, many=4단어 이상"
    labels: {few: 썸네일 글자 3단어 이하, many: 썸네일 글자 4단어 이상}
  - name: dominant_color
    values: [red, yellow, blue, green, black, white, mixed]
    hint: "썸네일 면적의 절반 이상을 차지하는 한 가지 색. 그런 색이 없으면 mixed"
    labels: {red: 빨간색 위주, yellow: 노란색 위주, blue: 파란색 위주, green: 초록색 위주, black: 검은색 위주, white: 흰색 위주, mixed: 여러 색 혼합}
  - name: thumb_title_overlap
    values: [none, partial, same]
    hint: "썸네일 글자와 제목의 겹침. none=썸네일 글자가 없거나 제목과 겹치는 단어가 없음, partial=일부 단어가 겹침, same=썸네일 글자가 제목과 거의 같음"
    labels: {none: 썸네일 글자와 제목이 다름, partial: 썸네일 글자와 제목이 일부 겹침, same: 썸네일 글자와 제목이 같음}

title:
  - name: form
    values: [statement, question, list, how_to, review, vs]
    hint: "제목 문장의 형태. question=묻는 문장(물음표·의문형), list=순위·목록(TOP, N가지), how_to=방법·하는 법, review=후기·리뷰·사용기, vs=둘 이상의 비교(vs, 비교), statement=그 밖의 서술"
    labels: {statement: 서술형 제목, question: 질문형 제목, list: 목록형 제목, how_to: 방법형 제목, review: 후기형 제목, vs: 비교형 제목}
  - name: has_number
    source: code # 제목에 숫자(유니코드 숫자)가 있으면 yes
    values: ["yes", "no"]
    labels: {"yes": 제목에 숫자, "no": 제목에 숫자 없음}
  - name: brackets
    source: code # 제목에 ()[]{}（）［］【】《》「」『』 중 하나가 있으면 yes. 따옴표는 세지 않는다
    values: ["yes", "no"]
    labels: {"yes": 제목에 괄호, "no": 제목에 괄호 없음}
