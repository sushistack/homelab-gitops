# ONE-OFF Job (2026-09-30): approve the 24 G-3 seed channels in prod
# (vignal repo docs/analysis/g3-channel-20-measurement.md). Only UCdUcjkyZtf-1WJyPPiETF1g was
# approved at the Story 2.10 deploy check; the G-3 approvals lived in a local DB.
#
# `vignal approve` takes one channel id and the image is distroless (no shell), so each id is its
# own initContainer, run one after another (they share the collector run lock; a CronJob run in
# progress makes approve fail fast). The final container prints `estimate --channels 25`.
#
# Lifecycle: PR adds this file -> ArgoCD syncs -> Job runs once. After it completes, a follow-up
# PR REMOVES this file and its kustomization entry (prune deletes the Job). No ttlSeconds:
# a TTL-deleted Job would be re-created by selfHeal and approve would run again.
#
