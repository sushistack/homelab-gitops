# One-off (2026-10-30, vignal Story 31.6 / D-45): `vignal estimate` against the prod DB and config after
# Epic 31 (FR-92 tagging targets: skip_short_s 180, per_channel_per_day 2).
# b: SQLite temp files need a writable /tmp (readOnlyRootFilesystem; first try failed with
# SQLITE_IOERR_GETTEMPPATH 6410) -> TMPDIR + emptyDir like cronjob.yaml.
# Read-only: estimate opens the DB (no schema change since sha-c860c40) and prints tables to stdout.
# Read the output in Argo CD (Job pod logs, container est-10000), then DELETE this file
# and its kustomization line in a follow-up commit (Argo prunes the Job).
apiVersion: batch/v1
kind: Job
metadata:
  name: vignal-estimate-20261030b
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vignal
        app.kubernetes.io/component: estimate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-sushistack
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: est-10000
          image: ghcr.io/sushistack/vignal:sha-cfd9b88
          args: ["estimate", "--channels", "10000"]
          env:
            - name: TZ
              value: Asia/Seoul
            - name: VIGNAL_DB
              value: /data/vignal.db
            - name: VIGNAL_CONFIG_DIR
              value: /config
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vignal-data
        - name: config
          configMap:
            name: vignal-config
        - name: tmp
          emptyDir: {}
