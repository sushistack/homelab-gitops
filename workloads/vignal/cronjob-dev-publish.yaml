# vignal dev data (2026-11-06) — every 6 hours (after each prod run), `vignal publish-dev`: a release for dev.vignal.kr built from a
# SNAPSHOT of the collector DB (VACUUM INTO under /tmp; the source is opened read-only, never written), published
# under the `dev/` prefix of the same public bucket (the public data domain + /dev). It calls no
# YouTube API and never touches the prod release (`releases/`, `manifest.json`) — prod's publish and retention
# read only those keys. It reuses the prod config (vignal-config); VIGNAL_DEV_ALLOW turns on, for the dev release
# only, the policy features prod has off (subject_flow while the quota review is open; r24 + observe_tags for the
# ③ comparison, 2026-11-08). With observe_tags it recomputes r24 on the snapshot and runs the observe-tag stage
# itself (Gemini, GEMINI_API_KEY from vignal-secrets, llm.monthly_budget_usd shared with prod's spend); the tags and
# open Gemini jobs persist in VIGNAL_DEV_STATE, a separate file on the data PV. Prod's collector switch stays off.
#
# Image: the app repo dev branch build (CI `image` job on dev pushes, or `crane append` on the prod image while CI is
# out of minutes), pinned by digest. Independent
# of the prod CronJob's pinned tag.
# KILL SWITCH = commit `spec.suspend: true` (PR -> merge); ArgoCD selfHeal reverts kubectl patches.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vignal-dev-publish
spec:
  # 2026-11-24: once a day (07:25 KST, 55 min after the 06:30 prod run). Every 6 h made vignal-data-dev write as many
  # D1 rows as prod (~1.6-2.2M/day) and pushed the account past the 50M/month included writes. Accepted cost: dev shows
  # the "갱신 지연" banner after ~12 h each day. A snapshot taken during a prod run is still consistent (WAL read transaction).
  schedule: "25 7 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  suspend: false
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vignal
            app.kubernetes.io/component: dev-publish
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-sushistack
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # 2026-11-24: the public read Postgres over the pg.vignal.kr tunnel (Access service token), on 127.0.0.1:5432
          # for VIGNAL_PG_DSN. Native sidecar: up before the collector, stopped after it (vignal docs/ops/postgres.md).
          initContainers:
            - name: pg-tunnel
              image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
              restartPolicy: Always
              args: ["access", "tcp", "--hostname", "pg.vignal.kr", "--url", "127.0.0.1:5432"]
              env:
                - name: TUNNEL_SERVICE_TOKEN_ID
                  valueFrom: { secretKeyRef: { name: vignal-pg, key: TUNNEL_SERVICE_TOKEN_ID } }
                - name: TUNNEL_SERVICE_TOKEN_SECRET
                  valueFrom: { secretKeyRef: { name: vignal-pg, key: TUNNEL_SERVICE_TOKEN_SECRET } }
              # No startupProbe: cloudflared listens on loopback and a tcpSocket probe dials the pod IP (refused). The
              # collector connects only after its publish, minutes later.
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: vignal
              image: ghcr.io/sushistack/vignal@sha256:7ff17866f0743dc1f1a34e5310a59b7d4ba6b60b80298d0aef8abcf0198e2753   # sha-bed1256 (dev 2026-11-24: public Postgres writes, vtopic reuses prod labels)
              args: ["publish-dev"]
              env:
                - name: TZ
                  value: Asia/Seoul
                - name: VIGNAL_PUBLISH_TARGET
                  value: r2
                - name: VIGNAL_DB
                  value: /data/vignal.db
                - name: VIGNAL_CONFIG_DIR
                  value: /config
                - name: VIGNAL_SCHEMA_SUPPORT_URL
                  value: https://${SECRET:DOMAIN_VIGNAL_SITE}/schema-support.json
                - name: VIGNAL_DEV_PREFIX
                  value: dev/
                - name: VIGNAL_DEV_ALLOW
                  value: subject_flow,r24,observe_tags,aux_ratios   # aux_ratios 2026-11-15: compare views-per-video + reaction rate (dev only)
                - name: VIGNAL_DEV_STATE
                  value: /data/vignal-dev-state.db   # dev-only tag rows; never read by the prod collector
                - name: VIGNAL_DEV_KEEP
                  value: "2"
                - name: VIGNAL_DEV_SNAPSHOT_KEY   # 2026-11-10: gzipped snapshot to the private bucket for local publisher tests
                  value: dev/snapshot/vignal-dev.db.gz
                - name: TMPDIR
                  value: /tmp
                - name: VIGNAL_PG_DSN   # 2026-11-24: collector writes each batch into the public read Postgres
                  valueFrom: { secretKeyRef: { name: vignal-pg, key: VIGNAL_PG_DSN_DEV } }
              envFrom:
                - secretRef:
                    name: vignal-secrets   # R2_* (public bucket write), GEMINI_API_KEY; same as the prod job
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 3Gi              # OOM at 2Gi 2026-11-13 (sha-998f618: peers/stats/provisional facts); OOM at 1Gi 2026-11-10 (vtopic + observe_tags + publish in one job); OOM at 512Mi 2026-11-03
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                # Read-write because SQLite's read-only WAL reader still needs the -shm file (the program opens
                # vignal.db with mode=ro and copies it with VACUUM INTO) and for vignal-dev-state.db.
                - name: data
                  mountPath: /data
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vignal-data   # RWO local-path on one node: this pod lands on the same node as prod's
            - name: config
              configMap:
                name: vignal-config
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi           # the DB snapshot (PVC is 2Gi)
