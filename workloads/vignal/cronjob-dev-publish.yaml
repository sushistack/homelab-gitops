# vignal dev data (2026-11-06) — every 6 hours (after each prod run), `vignal publish-dev`: a release for dev.vignal.kr built from a
# SNAPSHOT of the collector DB (VACUUM INTO under /tmp; the source is opened read-only, never written), published
# under the `dev/` prefix of the same public bucket (the public data domain + /dev). It calls no
# YouTube API and never touches the prod release (`releases/`, `manifest.json`) — prod's publish and retention
# read only those keys. It reuses the prod config (vignal-config); VIGNAL_DEV_ALLOW turns on, for the dev release
# only, the policy features prod has off (subject_flow while the quota review is open; r24 + observe_tags for the
# ③ comparison, 2026-11-08). With observe_tags it recomputes r24 on the snapshot and runs the observe-tag stage
# itself (Gemini, GEMINI_API_KEY from vignal-secrets, llm.monthly_budget_usd shared with prod's spend); the tags and
# open Gemini jobs persist in VIGNAL_DEV_STATE, a separate file on the data PV. Prod's collector switch stays off.
#
# Image: the app repo dev branch build (CI `image` job on dev pushes, or `crane append` on the prod image while CI is
# out of minutes), pinned by digest. Independent
# of the prod CronJob's pinned tag.
# KILL SWITCH = commit `spec.suspend: true` (PR -> merge); ArgoCD selfHeal reverts kubectl patches.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vignal-dev-publish
spec:
  # 03:30 KST: between prod runs (00:00/06:00, ~45 min each). A snapshot is consistent even if they overlap.
  # Every 6 h, right after each prod run (00/06/12/18 KST, ~45-52 min): the release meta says refresh_interval_hours 6,
  # so a daily dev release showed the "갱신 지연" banner after 12 h (2026-11-06). A snapshot taken during a prod run is
  # still consistent (WAL read transaction).
  schedule: "55 */6 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  suspend: false
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vignal
            app.kubernetes.io/component: dev-publish
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-sushistack
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: vignal
              image: ghcr.io/sushistack/vignal@sha256:98c5200eea9c713a6e2a8f92e5b17d699958563861fe285372d9db58a3fcaff1   # sha-f30fd68 (vignal dev f30fd68: dev r24 + observe tags)
              args: ["publish-dev"]
              env:
                - name: TZ
                  value: Asia/Seoul
                - name: VIGNAL_PUBLISH_TARGET
                  value: r2
                - name: VIGNAL_DB
                  value: /data/vignal.db
                - name: VIGNAL_CONFIG_DIR
                  value: /config
                - name: VIGNAL_SCHEMA_SUPPORT_URL
                  value: https://${SECRET:DOMAIN_VIGNAL_SITE}/schema-support.json
                - name: VIGNAL_DEV_PREFIX
                  value: dev/
                - name: VIGNAL_DEV_ALLOW
                  value: subject_flow,r24,observe_tags
                - name: VIGNAL_DEV_STATE
                  value: /data/vignal-dev-state.db   # dev-only tag rows; never read by the prod collector
                - name: VIGNAL_DEV_KEEP
                  value: "2"
                - name: TMPDIR
                  value: /tmp
              envFrom:
                - secretRef:
                    name: vignal-secrets   # R2_* (public bucket write), GEMINI_API_KEY; same as the prod job
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi              # same as prod's publish (OOM at 512Mi, 2026-11-03)
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                # Read-write because SQLite's read-only WAL reader still needs the -shm file (the program opens
                # vignal.db with mode=ro and copies it with VACUUM INTO) and for vignal-dev-state.db.
                - name: data
                  mountPath: /data
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vignal-data   # RWO local-path on one node: this pod lands on the same node as prod's
            - name: config
              configMap:
                name: vignal-config
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi           # the DB snapshot (PVC is 2Gi)
