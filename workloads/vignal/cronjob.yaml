# vignal collector — ONE CronJob, every 6h at :30 KST (06:30 run ready ≈06:55 for morning live prep, PERSONA31 유나), `vignal run` (ten stages, single-process run lock).
# Own image, built by the app repo's CI `image` job -> GHCR (private; pulled with ghcr-sushistack).
#
# KILL SWITCH = commit `spec.suspend: true` here (PR -> merge). `kubectl patch ... suspend` is NOT
# a kill switch: ArgoCD selfHeal reverts it. The in-code daily quota cap is the second layer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vignal
spec:
  schedule: "30 */6 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  # suspend: false since 2026-09-30 — vignal-web is live on vignal.kr (schema-support.json served),
  # so the publish preflight (vignal AD-3) can pass. KILL SWITCH: set back to true via PR.
  suspend: false
  # A hung run + Forbid would silently skip later runs; bound it so it fails visibly.
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0            # a failed run is a failed run (vignal AD-7); next schedule resumes
      activeDeadlineSeconds: 10800 # 2026-11-11: seeds grew the run 55→85분→초과(publish 순차 업로드); 사용자 승인 3시간. 이전 5400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vignal
            app.kubernetes.io/component: collector
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-sushistack
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # 2026-11-24: the public read Postgres over the pg.vignal.kr tunnel (Access service token), on 127.0.0.1:5432
          # for VIGNAL_PG_DSN. Native sidecar: up before the collector, stopped after it (vignal docs/ops/postgres.md).
          initContainers:
            - name: pg-tunnel
              image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
              restartPolicy: Always
              args: ["access", "tcp", "--hostname", "pg.vignal.kr", "--url", "127.0.0.1:5432"]
              env:
                - name: TUNNEL_SERVICE_TOKEN_ID
                  valueFrom: { secretKeyRef: { name: vignal-pg, key: TUNNEL_SERVICE_TOKEN_ID } }
                - name: TUNNEL_SERVICE_TOKEN_SECRET
                  valueFrom: { secretKeyRef: { name: vignal-pg, key: TUNNEL_SERVICE_TOKEN_SECRET } }
              # No startupProbe: cloudflared listens on loopback and a tcpSocket probe dials the pod IP (refused). The
              # collector connects only after its publish, minutes later.
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: vignal
              # Immutable sha tag from the app repo's CI (NOT :latest — version-lint rejects
              # floating refs). Upgrade = bump here + versions.yaml in one PR.
              image: ghcr.io/sushistack/vignal@sha256:dc8730d69faa10350b99317f91d73f9458e3796e15f9fe66c449396c50c9ab44   # sha-59eb30f (main 2026-11-24, PR #72/#74: Gemini vtopic only inside the publish cap + naive Bayes; public Postgres writes)
              args: ["run"]
              env:
                - name: TZ
                  value: Asia/Seoul
                - name: VIGNAL_PUBLISH_TARGET
                  value: r2
                - name: VIGNAL_DB
                  value: /data/vignal.db
                - name: VIGNAL_CONFIG_DIR
                  value: /config
                - name: VIGNAL_SCHEMA_SUPPORT_URL
                  value: https://${SECRET:DOMAIN_VIGNAL_SITE}/schema-support.json
                - name: TMPDIR
                  value: /tmp
                - name: VIGNAL_PG_DSN   # 2026-11-24: collector writes each batch into the public read Postgres
                  valueFrom: { secretKeyRef: { name: vignal-pg, key: VIGNAL_PG_DSN } }
              envFrom:
                - secretRef:
                    name: vignal-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 2Gi # 2026-11-10: seed 로 추적 1,913→3,500 대비 미리 올림(dev 발행이 1Gi 에서 OOM). 2026-11-03: 512Mi 에서 publish OOMKilled (job 29893860)
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: vignal-data
            - name: config
              configMap:
                name: vignal-config
            - name: tmp
              emptyDir: {}
