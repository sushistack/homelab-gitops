# ghcr-sushistack: GHCR pull cred for the PRIVATE collector image ghcr.io/sushistack/vignal
# (dockerconfigjson). Reused from the karakeep/anytype cred, re-sealed for ns vignal (sealed to name+ns).
# Re-seal: kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-sushistack
  namespace: vignal
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-sushistack
      namespace: vignal
    type: kubernetes.io/dockerconfigjson
