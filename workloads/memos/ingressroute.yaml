# Public route for memos: web -> websecure, TLS from the memos-tls Secret (certificate.yaml);
# plain HTTP 301-redirects to HTTPS. Same shape as ntfy/karakeep/miniflux — own-auth app, public,
# NOT CF Access (that tier is reserved for admin/monitoring tools).
# Host is tokenized (${SECRET:DOMAIN_MEMOS}); the render CMP substitutes at ArgoCD sync time.
# traefik.io/v1alpha1 (v3) — the old traefik.containo.us API silently fails.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: memos-redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTPS (websecure :443) — serves memos with the cert-manager cert.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: memos
  annotations:
    # public (whitelist): external-dns publishes this host to CF DNS
    external-dns.alpha.kubernetes.io/target: 761ca633-e9d6-4af8-8508-727bba00f0a9.cfargotunnel.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${SECRET:DOMAIN_MEMOS}`)
      kind: Rule
      services:
        - name: memos
          port: 80
  tls:
    secretName: memos-tls
---
# HTTP (web :80) — 301 to HTTPS via the redirect middleware.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: memos-redirect
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${SECRET:DOMAIN_MEMOS}`)
      kind: Rule
      middlewares:
        - name: memos-redirect-https
      services:
        - name: memos   # required by the IngressRoute schema; middleware redirects before it is hit
          port: 80
