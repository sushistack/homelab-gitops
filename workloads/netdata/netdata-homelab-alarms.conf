# Custom alarms filling gaps the stock netdata health.d set doesn't cover — added after the
# langfuse fan-noise incident (2026-07): a VM (k3s-cp-2) climbed from its normal ~14% baseline to
# 100%+ of a core over several days, and CPU temp rose from ~55-57C baseline to 74-76C, entirely
# unnoticed by netdata's default alarms (those only watch system.cpu, the HOST-WIDE average across
# all cores — one VM eating an extra core doesn't move that needle on a multi-core box). See
# _bmad-output/implementation-artifacts/investigations/langfuse-fan-noise-investigation.md.
#
# Both route through health_alarm_notify.conf's custom_sender(), which now sends CRITICAL to
# homelab-critical and WARNING/CLEAR to homelab-ops (previously everything was muted).

# cgroup.cpu covers every qemu VM AND every LXC container on the proxmox host (streamed in as
# host "proxmox") — template, not alarm, because there are multiple chart instances (one per
# VM/container) sharing this context.
template: cgroup_cpu_sustained_high
      on: cgroup.cpu
   class: Utilization
    type: System
component: CPU
   every: 1m
  lookup: average -15m unaligned of user,system
   units: % (100% = 1 core)
    warn: $this > 80
    crit: $this > 150
   delay: down 15m multiplier 1.5 max 1h
 summary: VM/container CPU usage sustained high
    info: 15-minute average total CPU for this VM/container (100% = 1 core). Baseline for the k3s
          control-plane VMs is ~14-30%; a sustained climb past this is the signature of a runaway
          background task (e.g. a database's own housekeeping merges), not normal load.
      to: sysadmin

# Chart id is already sensor-specific (one physical CPU package), so this targets a single chart —
# alarm, not template.
   alarm: proxmox_cpu_temp_high
      on: sensors.temperature_k10temp-pci-00c3_temp1_Tctl_input
   class: Utilization
    type: System
component: Sensors
   every: 1m
  lookup: average -10m unaligned of input
   units: Celsius
    warn: $this > 70
    crit: $this > 80
   delay: down 15m multiplier 1.5 max 1h
 summary: Proxmox host CPU temperature high
    info: 10-minute average CPU (Tctl) temperature. Healthy baseline is ~55-57C; this drives the
          case fan curve directly, so a sustained rise is what "the fan won't stop spinning" means
          in sensor terms — usually a runaway workload, not ambient conditions.
      to: sysadmin
