# ntfy-firebase: FCM service-account key (firebase-key.json) for Notify Android (kr.eli.notify). Sealed to name+ns; safe to commit.
# Mounted at /etc/ntfy-firebase (server.yml firebase-key-file). Rotate: new key in Firebase console -> reseal -> delete old key there.
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ntfy-firebase
  namespace: ntfy
spec:
  encryptedData:
    firebase-key.json: 
  template:
    metadata:
      name: ntfy-firebase
      namespace: ntfy
