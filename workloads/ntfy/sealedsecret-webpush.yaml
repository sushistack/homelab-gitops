# ntfy-webpush: VAPID private key for Web Push (env NTFY_WEB_PUSH_PRIVATE_KEY). Sealed to name+ns; safe to commit.
# The matching PUBLIC key is in server.yml (web-push-public-key) and ntfy-web deploy/config.js.
# Rotate: `ntfy webpush keys` in the pod, reseal, update both public-key copies (existing browser subscriptions must resubscribe).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ntfy-webpush
  namespace: ntfy
spec:
  encryptedData:
    NTFY_WEB_PUSH_PRIVATE_KEY: 
  template:
    metadata:
      name: ntfy-webpush
      namespace: ntfy
