---
# Top info bar: clock + weather + search. (resources widget removed)
- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: k3s
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true
- datetime:
    text_size: xl
    format:
      timeStyle: short
      dateStyle: short
      hourCycle: h23
- openmeteo:
    label: Seoul
    latitude: 37.5665
    longitude: 126.9780
    timezone: Asia/Seoul
    units: metric
    cache: 5
- search:
    provider: duckduckgo
    target: _blank
