# pve-api: read-only Proxmox token for nginx /pve/resources (user homelab-dash@pve, role PVEAuditor on /, token "dash").
# Re-seal: kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pve-api
  namespace: homelab-dash
spec:
  encryptedData:
    PVE_AUTH: 
  template:
    metadata:
      name: pve-api
      namespace: homelab-dash
