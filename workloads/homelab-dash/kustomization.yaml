---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml        # INTERNAL (CF Access app `monitoring`); host monitor.eli.kr
  - certificate.yaml         # letsencrypt-prod DNS-01
  - sealedsecret-ghcr.yaml   # ghcr-sushistack: pull cred for the PRIVATE image (re-sealed for ns homelab-dash)

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: homelab-dash
      app.kubernetes.io/part-of: homelab-dash
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/component: dashboard
