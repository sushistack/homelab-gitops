# Per-host production TLS (letsencrypt-prod, DNS-01; no public reachability needed).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-dash-tls
spec:
  secretName: homelab-dash-tls
  dnsNames:
    - "${SECRET:DOMAIN_MONITOR}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
