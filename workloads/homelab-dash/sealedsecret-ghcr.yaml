# ghcr-sushistack: GHCR pull cred for the PRIVATE image ghcr.io/sushistack/homelab-dash
# (dockerconfigjson). Reused from the vignal/karakeep cred, re-sealed for ns homelab-dash (sealed to name+ns).
# Re-seal: kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-sushistack
  namespace: homelab-dash
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-sushistack
      namespace: homelab-dash
    type: kubernetes.io/dockerconfigjson
