# Session 2 — the music library lives on its OWN dedicated 200G disk (k3s-cp-1 scsi3, mounted /mnt/music),
# the Story 5.6 node-local pattern. Off Longhorn via a static `local` PV — NEVER RWX-Longhorn (komga
# pvc-manga-local.yaml is the reference). Separate disk from the manga library (komga, /mnt/manga) —
# music and manga no longer share a failure domain or capacity.
#
# A `local` PV REQUIRES nodeAffinity (k8s enforces it), which PINS the consumer pod to k3s-cp-1 —
# slskd mounts this RWX PV read-write and downloads into /mnt/music/.incoming (child of the shared
# music volume). Navidrome reaches the SAME library via its own PV (see below).
#
# Dedicated disk = music SPOF is its own. Grow online: `qm resize 101 scsi3 +Ng` ->
# `growpart`+`resize2fs` on k3s-cp-1 (see runbook.md). Navidrome shares the SAME path via its OWN PV
# (workloads/navidrome/pvc-music-local.yaml) — a `local` PV has one claimRef/ns, so each ns gets its own.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: slskd-music-local
  annotations:
    argocd.argoproj.io/sync-options: Prune=false   # never let ArgoCD delete the PV binding to real data
spec:
  capacity:
    storage: 200Gi          # the shared disk size (informational for local volumes; grow the disk to expand)
  accessModes:
    - ReadWriteMany         # slskd (rw) mounts; RWX kept so any node-local music consumer can co-mount
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/music
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k3s-cp-1"]
  claimRef:
    namespace: slskd
    name: slskd-music-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-music-local
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: slskd-music-local   # bind to the static local PV above (1:1 via claimRef)
  resources:
    requests:
      storage: 200Gi
