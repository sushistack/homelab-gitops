# slskd.db = peer/search/transfer state — regenerable, so this is a FRESH local-path-retain claim in
# the slskd ns (the old lidarr-ns PV is not rebound; slskd re-inits from slskd.yml + creds on start).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-config
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 2Gi   # slskd.db (peer/search/transfer state)
