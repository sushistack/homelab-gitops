# Story 5.6 Task 6 (RECOMMENDED, NON-BLOCKING) — online sqlite3 .backup of komga's CONFIG DBs to R2,
# the Story 4.1 actor verbatim (only the dump command + paths changed). Backs up reading progress +
# library metadata (database.sqlite + tasks.sqlite). Does NOT back up the 90G manga (re-downloadable
# via Suwayomi; file-class -> Longhorn/NFS only, never R2 — the Story 4.1 bulk-media rule).
#
# Suwayomi's DB is NOT here: its H2 format has no online dump, so it gets the scale-to-0 tar actor
# in backup-cronjob-suwayomi.yaml instead.
#
# Reads the `komga-backup-r2` SealedSecret (sealed against the live cluster key, shares the
# ntfy-backup-r2 R2 cred). Live and running every 6h.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: komga-backup
spec:
  schedule: "35 */6 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: komga-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          # komga-config is RWO -> Longhorn attaches it to komga's node; co-schedule there to mount it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: komga
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: alpine:3.20   # PIN to a digest at hardening (AR29)
              command:
                - /bin/sh
                - -ceu
                - |
                  # ponytail: timeout every network/lock step so a hang exits non-zero and OnFailure
                  # retries WITH logs, instead of dying logless when activeDeadlineSeconds deletes the
                  # pod (what happened 2026-09-22). INVARIANT: these timeouts sum to 660s and must stay
                  # under activeDeadlineSeconds (900) — a whole run normally takes ~20s.
                  timeout 180 apk add --no-cache sqlite rclone ca-certificates tzdata
                  ts=$(date +%Y-%m-%dT%H-%M-%S)
                  timeout 90 sqlite3 /config/database.sqlite ".backup /scratch/database.sqlite"
                  timeout 90 sqlite3 /config/tasks.sqlite    ".backup /scratch/tasks.sqlite"
                  tar -C /scratch -czf "/scratch/komga-${ts}.tar.gz" database.sqlite tasks.sqlite
                  timeout 240 rclone copy "/scratch/komga-${ts}.tar.gz" "r2:homelab-k3s-services-backup/komga/"
                  timeout 60 rclone delete --min-age 72h "r2:homelab-k3s-services-backup/komga/" || true
              env:
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"
              envFrom:
                - secretRef:
                    name: komga-backup-r2
              volumeMounts:
                - name: config
                  mountPath: /config   # RW: online .backup needs -wal/-shm
                - name: scratch
                  mountPath: /scratch
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: komga-config
            - name: scratch
              emptyDir: {}
