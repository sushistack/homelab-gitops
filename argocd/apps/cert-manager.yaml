# Story 1.5 — Task 1: cert-manager as a wave-1 platform Application.
#
# Lives under argocd/ (the app-of-apps root recurses this dir and adopts it) rather than
# infra/cert-manager/, because its `source` is the REMOTE jetstack Helm chart — there are no
# local manifests to put in infra/. The cluster-issuer (our own manifests) DOES live in
# infra/cluster-issuer/ and its Application is argocd/apps/cluster-issuer.yaml.
#
# Vendor component -> Helm `source`, no chart mirroring. Version pinned in versions.yaml (SSOT).
# k3s owns Traefik; ArgoCD must NOT manage the Traefik controller — only cert-manager here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # AR3: CRDs before the ClusterIssuer (wave 2) / Certificates (wave 3)
spec:
  project: homelab
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3   # == versions.yaml cert-manager.chartVersion
    helm:
      values: |
        # v1.19.x: install the CRDs with the chart (older charts used `installCRDs: true`).
        crds:
          enabled: true
        # DNS-01 self-check: this network (OpenWrt DoH/Zapret) REFUSES plain :53 egress to public
        # resolvers / authoritative NS, so cert-manager's default direct-to-authoritative propagation
        # check fails ("connection refused"). It used to go via in-cluster CoreDNS -> OpenWrt, but
        # OpenWrt now does split-horizon for eli.kr (`address=/eli.kr/...` + local-only `server=/eli.kr/`),
        # so every *.eli.kr name — including _acme-challenge TXT — is answered locally and the check
        # never passes (memo.eli.kr renewal stuck "not yet propagated", 2026-11). Use public DoH over
        # :443 instead: bypasses both the :53 block and the LAN split view. Hostname, not an IPv4
        # literal (exposure gate).
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers=https://cloudflare-dns.com/dns-query
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # AR7: cert-manager CRD annotations exceed client-side apply
