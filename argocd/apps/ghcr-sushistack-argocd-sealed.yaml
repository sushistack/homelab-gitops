# ghcr-sushistack in ns argocd: lets Argo CD Image Updater READ the PRIVATE ghcr.io/sushistack/homelab-dash
# tags/digests (annotation homelabdash.pull-secret in argocd/apps/homelab-dash.yaml). Same dockerconfigjson
# as the per-workload copies, re-sealed for ns argocd (sealed to name+ns). Adopted by the app-of-apps root.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-sushistack
  namespace: argocd
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-sushistack
      namespace: argocd
    type: kubernetes.io/dockerconfigjson
