# vignal's runner scale set `vignal-k3s` — GitHub Actions jobs of github.com/sushistack/vignal (PRIVATE repo only:
# never point a self-hosted runner at a public repo, an outside PR would run code in the homelab) run here as
# ephemeral pods: one pod per job, removed when the job ends; three idle pods wait for the next jobs (minRunners 3).
#
# Multi-source Application:
#   Source 1: the gha-runner-scale-set chart (version pinned in versions.yaml).
#   Source 2: infra/arc-runners/ — the SealedSecret `arc-github` (key github_token: a fine-grained PAT on
#             sushistack/vignal with Administration read/write, which repo-level runner registration needs).
#
# No Docker in the runner (no privileged pod): the vignal CI builds its collector image with `crane` (a static Go
# binary appended onto distroless), and e2e installs Chromium with `sudo` (allowed by the runner image, not privileged).
# Switch the vignal CI between this and GitHub-hosted with the repo variable VIGNAL_RUNNER (unset = ubuntu-24.04).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-vignal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after the controller's CRDs (wave 0)
spec:
  project: homelab
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts   # OCI; declared in arc-oci-repo.yaml
      chart: gha-runner-scale-set
      targetRevision: 0.15.1   # == versions.yaml arc-runners-vignal.chartVersion
      helm:
        releaseName: vignal-k3s
        values: |
          githubConfigUrl: https://github.com/sushistack/vignal
          githubConfigSecret: arc-github
          runnerScaleSetName: vignal-k3s
          # 2026-11-27 (CI time): three runners stay warm. A new pod is up in a second, but GitHub hands it a job only
          # 40-50s later (measured), so `changes` takes one and web / e2e start at once on the other two. Idle cost is
          # the 2Gi memory request each. All runners share k3s-cp-3 (6 vCPU / 18 GiB on pve-k12) with the homelab-dash runner.
          minRunners: 3
          maxRunners: 3
          controllerServiceAccount:
            namespace: arc-systems
            name: arc-gha-rs-controller
          template:
            spec:
              # CI runs on k3s-cp-3 = the pve-k12 host (dev/CI machine), never next to services on pve.
              nodeSelector:
                kubernetes.io/hostname: k3s-cp-3
              imagePullSecrets:
                - name: ghcr-sushistack   # infra/arc-runners/sealedsecret-ghcr.yaml (the runner image is private)
              containers:
                - name: runner
                  # The stock runner 2.338.2 + Node, Go, PostgreSQL 16 and Playwright Chromium (vignal repo
                  # .github/runner/Dockerfile, built by scripts/build-runner-image.sh). == versions.yaml arc-runners-vignal.image
                  image: ghcr.io/sushistack/vignal-runner@sha256:d200878adab29d671cb034d140b97687c52ac203322bb9732bb1af726a6a0462   # pw1.64.1-go1.25.0-4e44d93a
                  command: ["/home/runner/run.sh"]
                  resources:
                    requests:
                      cpu: "1"
                      memory: 2Gi
                    limits:
                      # No CPU limit: the k3s-cp-3 vCPU count is the real ceiling (pve-k12 is the CI box);
                      # other pods keep their share via requests. Cap noise via the VM's cores, not here.
                      memory: 6Gi   # vitest + Playwright e2e peak
    - repoURL: https://github.com/sushistack/homelab-gitops.git
      targetRevision: HEAD
      path: infra/arc-runners
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
