# Pinned component versions — the GitOps-revertible single source of truth (NFR14).
# Re-confirm the exact tags at install time; bump here (not ad-hoc on the host).

k3s:
  # Phase 2a (Story 2.1): 3-node cluster, EMBEDDED ETCD (node 1 `--cluster-init`; nodes 2/3 join
  # as `server`), k3s-bundled Traefik. NOT v1.36 — stay on the 1.35 line so etcd stays on the 3.5
  # series (v1.36 ships etcd 3.6, the component we most fear bumping). Re-confirm the +k3sN suffix.
  version: v1.35.5+k3s1

argocd:
  # Helm chart whose appVersion is ArgoCD 3.4.x. Vendor chart referenced as a source — not mirrored.
  # Phase 2a: now also SELF-MANAGED via argocd/apps/argocd.yaml (this same chartVersion), so upgrades
  # are a one-line bump here + a manual self-app sync (AR5/NFR14).
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
  chartVersion: 9.7.1   # -> appVersion v3.4.4
  appVersion: v3.4.4

helm:
  # The Helm CLI is just the install tool, but pin it too: the upstream get-helm-3
  # script was being fetched from the moving `main` branch. Pin the script to a tag
  # AND the binary it installs (DESIRED_VERSION) so the host bootstrap is reproducible.
  installerRef: v3.16.4   # tag of helm/helm whose scripts/get-helm-3 we fetch
  version: v3.16.4        # DESIRED_VERSION the script installs

cert-manager:
  # Story 1.5: Phase 1 NON-PRODUCTION TLS (LE staging + Cloudflare DNS-01). Vendor Helm
  # chart referenced as an ArgoCD `source` (argocd/apps/cert-manager.yaml) — NOT mirrored.
  # For cert-manager the chart version == the app version. v1.19.x uses `crds.enabled: true`
  # (older charts used `installCRDs: true`). ServerSideApply required (CRD annotations are large).
  repo: https://charts.jetstack.io
  chart: cert-manager
  # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
  chartVersion: v1.21.3
  appVersion: v1.19.5

sealed-secrets:
  # Story 2.3: workload-secret encryption, wave 0 (controller + CRD must exist before any
  # later-wave workload references a materialized Secret). Vendor Bitnami Helm chart referenced
  # as an ArgoCD `source` (argocd/apps/sealed-secrets.yaml) — NOT mirrored.
  # Chart 2.22.0 maps to controller appVersion 0.41.2 (verified against the chart's Chart.yaml at
  # install time, per Dev Notes). The local `kubeseal` CLI is pinned to the SAME v0.41.2 so the
  # sealing format stays aligned with the controller. ServerSideApply required (large CRD — AR7).
  repo: https://bitnami.github.io/sealed-secrets   # repo moved bitnami-labs -> bitnami (old Pages site 404s)
  chart: sealed-secrets
  # renovate: datasource=helm depName=sealed-secrets registryUrl=https://bitnami.github.io/sealed-secrets
  chartVersion: 2.22.0     # -> appVersion v0.41.2
  appVersion: v0.41.2
  kubeseal: v0.41.2        # local CLI pin — keep in lockstep with appVersion on any bump

argocd-image-updater:
  # Auto-digest follow for ntfy-web + homelab-dash ONLY (our own apps; CI repins :latest every main push). Tracks
  # the digest :latest points to and writes it back to git → ArgoCD syncs. Every OTHER image stays
  # on the manual versions.yaml mirror below (scoped via per-Application annotations). Vendor
  # argo-helm chart referenced as an ArgoCD `source` (argocd/apps/argocd-image-updater.yaml) — NOT
  # mirrored. ponytail: one tracked image doesn't justify retiring the manual mirror for the rest.
  repo: https://argoproj.github.io/argo-helm
  chart: argocd-image-updater
  # renovate: datasource=helm depName=argocd-image-updater registryUrl=https://argoproj.github.io/argo-helm
  # The 1.x line is a CRD-based operator (needs an ImageUpdater CR per app); the CLASSIC line is
  # annotation-driven (config lives on the Application CR — what we use). Stay on the last classic.
  chartVersion: 0.14.0     # -> appVersion v0.17.0
  appVersion: v0.17.0

# ─────────────────────────────────────────────────────────────────────────────
# Workload image registry (Story 5.3 — completes the Version SSOT, AC1).
#
# "What is on what version" is answerable from THIS file alone — platform charts
# above, application images below. Each entry pins the *exact* image ref the
# manifest runs (digest preferred per AR29; explicit tag where upstream ships no
# stable digest). NO `:latest`, ever (enforcement rule).
#
# # ponytail: this is the SANCTIONED mirror, not a single-substitution CMP.
#   There is no image-templating layer (the render CMP only substitutes
#   ${SECRET:*} hostname tokens), and building one for ~14 images would be
#   over-engineering. So the deploy-time value also lives inline in each manifest
#   and this file mirrors it. `bin/version-lint` makes THIS file authoritative:
#   it fails CI if a manifest's image drifts from the ref pinned here, so the
#   "second place" is a checked mirror, not an independent source.
#   Ceiling: edit-here-then-mirror + lint. Upgrade path if mirroring ever chafes:
#   a Kustomize `images:` transformer per overlay (single substitution). Not now.
#   Renovate (renovate.json) opens the bump PRs against the manifests; bump this
#   file in the SAME PR (the lint enforces it).
#
# NOT enumerated here (Renovate still manages them inline, but they don't define
# "what version is service X on"): pure tool images — alpine:3.20 / busybox:1.36
# (cutover ingest + backup jobs), alpine/k8s in infra/ops-alerts. k3s + helm pins
# (above) are host-bootstrap via Ansible, NOT ArgoCD-synced, so the lint checks
# the chart pins against argocd/apps targetRevisions but leaves those two to the
# bootstrap layer.
workloads:
  excalidraw:
    manifest: workloads/excalidraw/deployment.yaml
    image: excalidraw/excalidraw@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
  ntfy:
    manifest: workloads/ntfy/deployment.yaml
    image: binwiederhier/ntfy:v2.24.0@sha256:f8a9b104313b87cc24ae4f775f39e6328205b57dff6ede3eaf098a91e5d79f59
  memos:
    manifest: workloads/memos/deployment.yaml
    image: neosmemo/memos:0.30.0@sha256:51a4cef418b1f173ac37139ad99de08da5b8662136007231d3ac8a0498a3095a   # v0.30.0
  navidrome:
    manifest: workloads/navidrome/deployment.yaml
    image: deluan/navidrome:0.62.0@sha256:c4b5cb36a790b3eb63ca6a68bbe2fe149c2d7fa2e586f7a480e61db630e6664b
  miniflux:
    manifest: workloads/miniflux/deployment.yaml
    image: miniflux/miniflux:2.3.5     # upstream ships no stable digest tag stream; explicit semver tag
  miniflux-db:
    manifest: workloads/miniflux/db-deployment.yaml
    image: postgres:18                 # major pin (client major == server major, AR29); patch floats within 18
  n8n:
    manifest: workloads/n8n/deployment.yaml
    image: n8nio/n8n:2.48.0
  tickerdeck:
    manifest: workloads/tickerdeck/deployment.yaml
    # Own app (github.com/sushistack/ticker.deck), built by its container.yml -> GHCR multi-arch.
    # Immutable sha-<short> tag from that workflow; bump on each app release.
    image: ghcr.io/sushistack/ticker.deck:sha-e310b16
  arc-controller:
    manifest: argocd/apps/arc-controller.yaml
    # GitHub Actions Runner Controller (gha-runner-scale-set-controller), OCI Helm on ghcr.io.
    chartVersion: 0.15.1
  arc-runners-vignal:
    manifest: argocd/apps/arc-runners-vignal.yaml
    # vignal runner scale set (gha-runner-scale-set chart) + the runner image it starts per job.
    chartVersion: 0.15.1
    image: ghcr.io/actions/actions-runner:2.338.2
  arc-runners-homelab-dash:
    manifest: argocd/apps/arc-runners-homelab-dash.yaml
    # homelab-dash runner scale set; same chart + runner image as arc-runners-vignal.
    chartVersion: 0.15.1
    image: ghcr.io/actions/actions-runner:2.338.2
  vignal:
    manifest: workloads/vignal/cronjob.yaml
    # Own app (github.com/sushistack/vignal, private), built by its CI `image` job -> GHCR (amd64).
    # Pinned by digest (comment = source sha); bump here + cronjob.yaml in one PR.
    image: ghcr.io/sushistack/vignal@sha256:1944df6dc3ba71f8b381e432de1464b0082390d1dadbd993491916f3b6dded12   # sha-d62f9aa
  vignal-dev-publish:
    manifest: workloads/vignal/cronjob-dev-publish.yaml
    # Built from the app repo's `dev` branch (CI `image` job on dev pushes, or crane append on the prod image while
    # CI is out of minutes; tag dev-<sha>), pinned by digest. Dev data only.
    image: ghcr.io/sushistack/vignal@sha256:a015d1195587dd09e1dd3a86d1e21ba504d567915b8e5b1ab59a46975d938a42   # sha-8bd6266
  anytype-heart:
    manifest: workloads/anytype/deployment-heart.yaml
    image: ghcr.io/sushistack/home.server/anytype-heart@sha256:8f1de0ea70e34ef976b98a2cbdc9622fd7ee24c713c724d301500a066f8aac73
  anytype-anysync:
    manifest: workloads/anytype/deployment-anysync.yaml
    image: ghcr.io/grishy/any-sync-bundle:1.4.3-2026-04-21@sha256:f25e0a648c78a3b36fa44dc8c0deda8c4b35c8b3f50799f04b31ba4531e732d5
  karakeep-web:
    manifest: workloads/karakeep/deployment-web.yaml
    image: ghcr.io/karakeep-app/karakeep:0.32.0@sha256:64d6a9bbf2d37b5c808cf06b5d87f1f1c7846fdd3844724145a9741aeb06fd31
  karakeep-meilisearch:
    manifest: workloads/karakeep/deployment-meilisearch.yaml
    image: getmeili/meilisearch:v1.41.0@sha256:860fa4baed04ae1c235de870edab0c8006227546dea1bbb6411fbfc5e27cf1db
  karakeep-chrome:
    manifest: workloads/karakeep/deployment-chrome.yaml
    image: gcr.io/zenika-hub/alpine-chrome@sha256:1a0046448e0bb6c275c88f86e01faf0de62b02ec8572901256ada0a8c08be23f
  karakeep-bridge:
    manifest: workloads/karakeep/deployment-bridge.yaml
    image: ghcr.io/sushistack/home.server/karakeep-anytype-bridge@sha256:d39011c4002edb387ffda07cd12c7cfcd41cc8951627e415d90dab4714414afb
  vaultwarden:
    manifest: workloads/vaultwarden/deployment.yaml
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
  # Story 5.6 — standalone-LXC consolidation. Tags pinned now (lint passes); SWAP TO @sha256 digests
  # at cutover (AR29 — the manifest comments carry the `imagetools inspect` command for each).
  komga:
    manifest: workloads/komga/deployment-komga.yaml
    image: gotson/komga:1.30.1   # forward-only DB migrations — never downgrade; rollback = restore backup
  suwayomi:
    manifest: workloads/komga/deployment-suwayomi.yaml
    image: ghcr.io/suwayomi/tachidesk:v2.4.2366@sha256:1fac27c387dc2ea9949e1a01ad7f6d6de9d72d3988338a95476748e5c45c4582  # stable @ 2026-09-30 (retired floating :stable, AR29)
  calibre:
    manifest: workloads/calibre/deployment.yaml
    image: lscr.io/linuxserver/calibre-web:0.6.27
  # Story 5.7 — Day-2 self-service tooling (internal-only). Tags are PLACEHOLDERS pinned now so the
  # lint passes; CONFIRM the exact current stable tag + SWAP TO @sha256 digests at install/cutover
  # (AR29 — each manifest comment carries the `imagetools inspect` command).
  semaphore:
    manifest: workloads/semaphore/deployment.yaml
    image: semaphoreui/semaphore:v2.20.23
  # Beszel decommissioned 2026-06-22 — superseded by Netdata (node + per-pod + Proxmox-child). See DECISIONS.md.
  # Netdata — heavier-detail node + per-pod monitoring (parent dashboard/dbengine + children DaemonSet
  # streaming). SAME image for both roles (role = config). Tag pinned now (lint passes); SWAP TO @sha256
  # at cutover (AR29):  docker buildx imagetools inspect netdata/netdata:v2.10.3
  netdata-parent:
    manifest: workloads/netdata/deployment-parent.yaml
    image: netdata/netdata:v2.12.3
  netdata-children:
    manifest: workloads/netdata/daemonset-children.yaml
    image: netdata/netdata:v2.12.3
  # Story 5.8 — uptime-kuma migrated INTO k3s (was Compose/NPM on .20). Pinned to the exact digest
  # the live host ran (:latest == 1.23.17) so the migrated kuma.db schema matches (AR29).
  uptime-kuma:
    manifest: workloads/uptime-kuma/deployment.yaml
    image: louislam/uptime-kuma:1.23.17@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
  # Story 5.10 — cloudflared relocated off the retiring docker LXC (.20) INTO k3s as a 2-replica
  # infra Deployment (the public *.eli.kr edge / Plane 0). Was :latest on .20; pinned on the move
  # to the digest the host last ran (2026.6.1). Same tunnel/token — only its home changed.
  cloudflared:
    manifest: infra/cloudflared/deployment.yaml
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
  # Stage 1 (public-host-automation) — external-dns automates public *.eli.kr CF DNS off Traefik
  # IngressRoutes. Tag pinned now (lint passes); SWAP TO @sha256 at apply (AR29):
  #   crane digest registry.k8s.io/external-dns/external-dns:v0.21.0
  external-dns:
    manifest: infra/external-dns/deployment.yaml
    image: registry.k8s.io/external-dns/external-dns:v0.24.0@sha256:a80a146d2540fa138565e404f0625157271071a06093021f27ae19d8316d10f9

# ─────────────────────────────────────────────────────────────────────────────
# Host-layer LXCs (hand-provisioned on Proxmox, outside ArgoCD — see docs/runbooks/).
#
# Version sensitivity: Anki's sync protocol changes between releases. Server (LXC) and
# ALL clients (desktop, phone) MUST run the same version. Bump them together — this is
# the single most likely operational failure. Re-confirm the exact release at install
# time from https://github.com/ankitects/anki/releases.
host-layer:
  anki:
    # Proxmox LXC anki (#202). anki-syncserver (:27701) only since 2026-11-12; anki-headless
    # (AnkiConnect :8765) is installed but disabled — see the runbook's 현재 상태 note.
    # See docs/runbooks/anki-lxc.md. AnkiConnect add-on ID: 2055492159 (installed separately).
    version: 25.02.7          # CONFIRM at install — must match desktop + phone client versions
    ankiconnect_addon: "2055492159"
